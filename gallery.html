<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Aporia Literary Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" type="image/png" href="/images/favicon-aporia.png">

  <link rel="stylesheet" href="aporia.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo aporia-word">aporia</a>

      <nav class="nav-links">
        <a href="/about">About</a>
        <!--<a href="masthead/masthead.html">Masthead</a>-->
        <a href="/publications">Publications</a>
        <a href="/submit">Submit</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="page-banner">
    <img src="/images/aporia banner.png" alt="Banner image" class="page-banner-image" />
    <div class="page-banner-overlay"></div>

    <div class="page-banner-content">
      <p class="page-banner-kicker">Aporia</p>
      <h1 class="page-banner-title">Gallery</h1>
    </div>
  </section>

  <main>
    <section class="gallery-section fade-section">
      <div class="gallery-container">
        <h2>Volume 01 Book Launch</h2>

        <div class="gallery-grid" aria-label="Volume 01 Book Launch photo gallery">
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 1">
            <img src="/images/gallery/book-launch-01.jpg" alt="Volume 01 Book Launch photo 1" />
            <span>Photo 01</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 2">
            <img src="/images/gallery/book-launch-02.jpg" alt="Volume 01 Book Launch photo 2" />
            <span>Photo 02</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 3">
            <img src="/images/gallery/book-launch-03.jpg" alt="Volume 01 Book Launch photo 3" />
            <span>Photo 03</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 4">
            <img src="/images/gallery/book-launch-04.jpg" alt="Volume 01 Book Launch photo 4" />
            <span>Photo 04</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 5">
            <img src="/images/gallery/book-launch-05.jpg" alt="Volume 01 Book Launch photo 5" />
            <span>Photo 05</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 6">
            <img src="/images/gallery/book-launch-06.jpg" alt="Volume 01 Book Launch photo 6" />
            <span>Photo 06</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 7">
            <img src="/images/gallery/book-launch-07.jpg" alt="Volume 01 Book Launch photo 7" />
            <span>Photo 07</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 8">
            <img src="/images/gallery/book-launch-08.jpg" alt="Volume 01 Book Launch photo 8" />
            <span>Photo 08</span>
          </button>
          <button class="gallery-item" type="button" aria-label="Open Volume 01 Book Launch photo 9">
            <img src="/images/gallery/book-launch-09.jpg" alt="Volume 01 Book Launch photo 9" />
            <span>Photo 09</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <div class="gallery-lightbox" id="galleryLightbox" aria-hidden="true">
    <button class="gallery-lightbox-close" type="button" aria-label="Close expanded image">x</button>
    <button class="gallery-lightbox-nav gallery-lightbox-prev" type="button" aria-label="Show previous photo">&lsaquo;</button>
    <img src="" alt="" id="galleryLightboxImage" />
    <button class="gallery-lightbox-nav gallery-lightbox-next" type="button" aria-label="Show next photo">&rsaquo;</button>
  </div>

  <script src="aporia.js"></script>

  <footer class="site-footer">
    <div class="footer-container">
      <a
        href="https://www.instagram.com/aporialiterary"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-instagram"
        aria-label="Visit Aporia on Instagram"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
      </a>

      <div class="footer-text">
        <p>Â© Aporia 2026. Canada's premier youth-led publication.</p>
        <p>Based in Toronto, ON</p>
      </div>
      <a href="/" class="footer-logo-link" aria-label="Aporia home">
        <img src="/images/aporia logo red.png" alt="Aporia logo" class="footer-logo-image" />
      </a>
    </div>
  </footer>
</body>
</html>
